# Databricks Asset Bundle — Brightwave score-refresh Job (Build 2).
#
# The challenge's TABLE-UPDATE TRIGGER (event-driven, low-latency, idle when
# nothing changed — deliberately NOT a cron). Fires only when the gold scoring
# tables actually commit new data; the task refreshes the Lakebase synced tables
# (best-effort) and logs a `scoring_trigger` row into app.workflow_events.
#
# Isolated from the workshop bundle (../databricks.yml) so deploying it never
# disturbs the Build-1 schema/volume/setup resources. Deploy:
#   cd brightwave/score_refresh
#   databricks bundle deploy --target prod
#   databricks bundle run brightwave_score_refresh   # optional one-shot for evidence
bundle:
  name: brightwave-score-refresh

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

variables:
  catalog:
    default: brightwave_techsummit27_catalog
  schema:
    default: brightwave
  pghost:
    default: ep-delicate-mountain-d8kizg3e.database.us-east-2.cloud.databricks.com
  pgdatabase:
    default: brightwave_lakebase_tkop
  lakebase_endpoint:
    default: projects/brightwave-campaign-desk/branches/production/endpoints/primary
  synced_pipeline_id:
    description: Optional — the managed synced-table pipeline to refresh on each firing.
    default: ""

resources:
  jobs:
    brightwave_score_refresh:
      name: "[Brightwave] Score refresh -> workflow_events (table-update trigger)"
      description: "Event-driven: on gold scoring-table commits, refresh synced tables + log a scoring_trigger row into app.workflow_events."
      # Table-update trigger — fires when EITHER gold scoring table commits new
      # data; debounced so a burst of commits collapses into one run.
      trigger:
        table_update:
          table_names:
            - brightwave_techsummit27_catalog.brightwave.gold_campaign_position
            - brightwave_techsummit27_catalog.brightwave.gold_action_recommendations
          condition: ANY_UPDATED
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 90
      tasks:
        - task_key: score_refresh_log
          notebook_task:
            notebook_path: ./score_refresh_log.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              pghost: ${var.pghost}
              pgdatabase: ${var.pgdatabase}
              lakebase_endpoint: ${var.lakebase_endpoint}
              synced_pipeline_id: ${var.synced_pipeline_id}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "4"
            dependencies:
              - databricks-sdk
              - psycopg[binary]

targets:
  # Dev mode pauses triggers by default; deploy the prod target so the
  # table-update trigger is actually ARMED. `databricks bundle deploy --target prod`.
  dev:
    mode: development
  prod:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/brightwave-score-refresh/prod
