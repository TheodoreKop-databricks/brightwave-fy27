# Databricks Asset Bundle — Workshop: Brightwave (Campaign Replication & Budget Rescue).
#
# WORKSHOP TEMPLATE — this bundle does the MINIMUM so a trainee can start the
# AI Customer Challenge: it stands up the schema + a raw-data Volume and a job
# that generates the synthetic dataset. It deliberately does NOT build the
# pipeline, metric view, model, dashboard, Lakebase, or the app — those are the
# graded milestones the trainee builds (see README.md → "What YOU need to
# create" and app/APP_WORKSHOP.md).
#
#   1. `databricks bundle deploy`               → schema + raw_data volume + setup job
#   2. `databricks bundle run brightwave_setup` → generates the synthetic raw data
#   Then follow README.md: build Milestone 1 (Data) → 2 (Lakebase) → 3 (App) → 4 (AI Gateway).
#
# The README + specifications/ + data_generation/ + app/ come with the forked
# template folder; this bundle only provisions the workspace resources needed to
# get data flowing. Deploy is documented in README.md — do NOT run it as part of authoring.
bundle:
  name: workshop-brightwave

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/brightwave-workshop

variables:
  catalog:
    description: Unity Catalog for the workshop data (must already exist / you can create it).
    default: brightwave_techsummit27_catalog
  schema:
    description: Schema for the demo tables + the raw_data volume (created by this bundle).
    default: brightwave

resources:
  pipelines:
    brightwave_campaign_360:
      name: "brightwave_campaign_360"
      catalog: ${var.catalog}
      target: ${var.schema}
      libraries:
        - glob:
            include: ./transformation/**
      serverless: true
      continuous: false
      development: false
      photon: true
      channel: current
      configuration:
        catalog: ${var.catalog}
        schema: ${var.schema}

  jobs:
    brightwave_setup:
      name: "[Workshop] Brightwave — generate data"
      description: "Generates the synthetic raw_* parquet datasets into the raw_data volume. Run this once after deploy, then build the pipeline/Lakebase/app/gateway yourself."
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ./data_generation/generate_data.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: sdk_default
      environments:
        - environment_key: sdk_default
          spec:
            client: "4"
            dependencies:
              - numpy
              - pandas
              - faker

targets:
  dev:
    default: true
  prod:
    mode: production
